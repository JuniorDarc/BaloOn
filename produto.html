<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Produto | BaloOn</title>
</head>
<body>

<header>
    <h1>BaloOn</h1>
</header>

<main>
    <a href="index.html" class="back-button">← Voltar para a loja</a>

    <section class="product-page">
        <img id="product-image" src="" alt="Produto">

        <div class="product-info">
            <h2 id="product-name" class="no-select"></h2>
            <p id="product-description" class="no-select"></p>
            <span class="price" id="product-price" class="no-select"></span>

            <div class="delivery-options">
    <p>Como você deseja receber?</p>

    <label>
        <input type="radio" name="delivery" value="Retirada na loja">
        Retirar na loja
    </label>

    <label>
        <input type="radio" name="delivery" value="Entrega em domicílio">
        Receber em casa
    </label>
</div>

<div class="payment-options">
    <p>Forma de pagamento</p>

    <label>
        <input type="radio" name="payment" value="Pix">
        Pix
    </label>

    <label>
        <input type="radio" name="payment" value="Cartão">
        Cartão
    </label>

    <label>
        <input type="radio" name="payment" value="Dinheiro">
        Dinheiro
    </label>
</div>



            <button id="whatsapp-button" class="whatsapp-button">
              Comprar no WhatsApp
            </button>
        </div>
    </section>
</main>

<footer>
    © 2026 - BaloOn. Todos os direitos reservados.
</footer>

<script src="javaScript/produto.js"></script>
</body>
</html>
